name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      # Move built files into the correct subfolder so GitHub Pages
      # serves the React app at /Srikanth/DataOrchestration/Prototype/
      - name: Restructure dist for GitHub Pages
        run: |
          mkdir -p dist/Srikanth/DataOrchestration/Prototype
          cp dist/assets dist/Srikanth/DataOrchestration/Prototype/ -r 2>/dev/null || true
          cp dist/index.html dist/Srikanth/DataOrchestration/Prototype/ 2>/dev/null || true
          cp hippocratic-orchestration-pitch.html dist/
          # Add a root index that redirects to the pitch page
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=hippocratic-orchestration-pitch.html" />
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="hippocratic-orchestration-pitch.html">pitch page</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

